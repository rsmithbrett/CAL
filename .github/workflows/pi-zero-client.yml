name: Pi Zero shared scheduler slice

on:
  push:
    branches: ["feature/pi-zero-client"]
  pull_request:
    paths:
      - "pi/**"
      - "App/CardManager.cpp"
      - "PI_ZERO_CLIENT_*.md"
      - ".github/workflows/pi-zero-client.yml"

jobs:
  host-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run shared scheduling tests
        run: make -C pi test

  armv6-emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pi Zero cross compiler and QEMU user mode
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf qemu-user
      - name: Build and run tests as ARM1176
        run: |
          arm-linux-gnueabihf-g++ --version | head -1
          qemu-arm --version | head -1
          make -C pi test-armv6
          file pi/build/armv6/*_test

  display-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev fonts-dejavu-core
      - name: Build and render viewport fixtures
        run: |
          make -C pi demo
          SDL_VIDEODRIVER=dummy pi/build/pi-card --width 320 --height 240 --once /tmp/pi-320.bmp
          SDL_VIDEODRIVER=dummy pi/build/pi-card --width 1280 --height 720 --once /tmp/pi-1280.bmp
          python3 - <<'PY'
          import struct
          for path, expected in [('/tmp/pi-320.bmp', (320, 240)),
                                 ('/tmp/pi-1280.bmp', (1280, 720))]:
              data = open(path, 'rb').read()
              assert data[:2] == b'BM'
              assert struct.unpack_from('<ii', data, 18) == expected
              assert len(data) > expected[0] * expected[1]
              assert len(set(data[54:])) > 16
              print(f'{path}: {expected[0]}x{expected[1]}, {len(data)} bytes')
          PY

  esp32-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Build CAL and App with the shared header
        run: bash ci/build-firmware.sh
      - name: Check build artifacts and checksums
        run: |
          test -s combined-checksums.txt
          test -s build/esp32.esp32.esp32/CAL.ino.bin
          test -s App/build/esp32.esp32.esp32/App.ino.bin
          cat combined-checksums.txt
