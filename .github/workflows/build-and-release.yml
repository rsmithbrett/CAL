name: Build and publish CAL firmware

# Ship model: push to main, CI builds and publishes - never a manual build,
# never a manual release. See VERSIONING.md for the two things this
# publishes and when: the rolling "latest" release (every push, same tag,
# same URLs every time) and a permanent v<VERSION> release (only when the
# VERSION file changes, never overwritten again).
#
# Deliberately thin: everything about actually BUILDING the firmware lives in
# ci/build-firmware.sh, runnable identically on any machine or CI provider.
# Only three things below are genuinely specific to GitHub - getting
# arduino-cli onto the runner, checking whether a version tag already
# exists, and publishing to a GitHub Release - so those are the only steps a
# move to a different CI provider would need to replace.
#
# Never triggers on pull requests: a fork's CI run must never be able to
# publish a release using this repo's own token.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Build
        # Invoked via bash explicitly rather than ./ci/build-firmware.sh: a
        # script committed from a Windows filesystem does not reliably carry
        # its executable bit into git, and this way it does not matter.
        run: bash ci/build-firmware.sh

      - name: Publish the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body_path: build/esp32.esp32.esp32/checksums.txt
          make_latest: true
          files: |
            build/esp32.esp32.esp32/CAL.ino.merged.bin
            build/esp32.esp32.esp32/CAL.ino.bin
            build/esp32.esp32.esp32/CAL.ino.bootloader.bin
            build/esp32.esp32.esp32/CAL.ino.partitions.bin
            build/esp32.esp32.esp32/checksums.txt

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the permanent v${{ steps.version.outputs.value }} release
        # Only when VERSION changed to a value not already tagged. This tag is
        # never reused - see VERSIONING.md on why "latest" and a numbered
        # release answer different questions and neither can substitute for
        # the other.
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body_path: build/esp32.esp32.esp32/checksums.txt
          make_latest: false
          files: |
            build/esp32.esp32.esp32/CAL.ino.merged.bin
            build/esp32.esp32.esp32/CAL.ino.bin
            build/esp32.esp32.esp32/CAL.ino.bootloader.bin
            build/esp32.esp32.esp32/CAL.ino.partitions.bin
            build/esp32.esp32.esp32/checksums.txt
