name: Android portability scaffold

on:
  push:
    branches: ["feature/android-card-port"]
  pull_request:
    paths:
      - "android/**"
      - "App/Cards.h"
      - "ANDROID_PORT_*.md"
      - ".github/workflows/android-port.yml"

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Check native library and APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          find android/app/build/intermediates -name 'libdiscovercards.so' -print -quit | grep -q libdiscovercards.so
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-portability-scaffold
          path: android/app/build/outputs/apk/debug/app-debug.apk
