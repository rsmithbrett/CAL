name: Mutation host test

# Adversarial-review harness. Runs the host tests the release gate runs, on a
# push to a mut/** or test/** branch, so a mutation can be measured without a
# token to dispatch bench-cal.yml with. Never publishes anything and never runs
# on main. Carried on throwaway branches only.
on:
  push:
    branches:
      - 'mut/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Each step is guarded by hashFiles, so a mutation branch cut from a
      # commit that predates one of these scripts runs the rest rather than
      # failing on a missing file - which would read as the mutation being
      # caught.
      - name: Test recovery gesture and actions on host
        if: ${{ hashFiles('ci/test-recovery-menu.sh') != '' }}
        run: bash ci/test-recovery-menu.sh
      - name: Test the loader's NVS write order on host
        if: ${{ hashFiles('ci/test-loader-order.sh') != '' }}
        run: bash ci/test-loader-order.sh
      - name: Test the App's configuration-menu gesture on host
        if: ${{ hashFiles('ci/test-config-request.sh') != '' }}
        run: bash ci/test-config-request.sh
      - name: Test the scoreboard's column arithmetic on host
        if: ${{ hashFiles('ci/test-card-columns.sh') != '' }}
        run: bash ci/test-card-columns.sh
      - name: Test the RAM picture budget against the TLS pool on host
        if: ${{ hashFiles('ci/test-ram-picture-budget.sh') != '' }}
        run: bash ci/test-ram-picture-budget.sh
      - name: Check the panel's text state
        if: ${{ hashFiles('ci/check-text-state.sh') != '' }}
        run: bash ci/check-text-state.sh
      - name: Check the scoreboard's call into the column arithmetic
        if: ${{ hashFiles('ci/check-board-columns-call.sh') != '' }}
        run: bash ci/check-board-columns-call.sh
      - name: Check the RAM budget's call site
        if: ${{ hashFiles('ci/check-ram-budget-call.sh') != '' }}
        run: bash ci/check-ram-budget-call.sh
      - name: Check what a score below zero does
        if: ${{ hashFiles('ci/check-score-guard.sh') != '' }}
        run: bash ci/check-score-guard.sh
      - name: Test the reported counters past the end of a uint8_t on host
        if: ${{ hashFiles('ci/test-reported-counter.sh') != '' }}
        run: bash ci/test-reported-counter.sh
      - name: Check the asset counters' call sites
        if: ${{ hashFiles('ci/check-asset-counters.sh') != '' }}
        run: bash ci/check-asset-counters.sh
      - name: Test the WiFi setup confirmation on host
        if: ${{ hashFiles('ci/test-wifi-setup-button.sh') != '' }}
        run: bash ci/test-wifi-setup-button.sh
      - name: Test the personal photographs content key on host
        if: ${{ hashFiles('ci/test-personal-photos-key.sh') != '' }}
        run: bash ci/test-personal-photos-key.sh
      - name: Test the announcement and home value content keys on host
        if: ${{ hashFiles('ci/test-announcement-and-home-value-keys.sh') != '' }}
        run: bash ci/test-announcement-and-home-value-keys.sh
      - name: Test a card cannot register without naming a key policy
        if: ${{ hashFiles('ci/test-key-policy.sh') != '' }}
        run: bash ci/test-key-policy.sh
      - name: Check the content key reaches the wire
        if: ${{ hashFiles('ci/check-content-key-resolvers.sh') != '' }}
        run: bash ci/check-content-key-resolvers.sh
      - name: Check every card owes the key policy its registration states
        if: ${{ hashFiles('ci/check-card-key-decisions.sh') != '' }}
        run: bash ci/check-card-key-decisions.sh

  full-gate:
    # The arduino-cli half of the release gate, for mutations that only a real
    # compile could catch, and for reading a byte count off a branch. Opted into
    # by the commit message so an ordinary mutation costs a minute rather than
    # fifteen.
    if: ${{ contains(github.event.head_commit.message, '[full-gate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Test recovery gesture and actions on host
        if: ${{ hashFiles('ci/test-recovery-menu.sh') != '' }}
        run: bash ci/test-recovery-menu.sh
      - name: Test the loader's NVS write order on host
        if: ${{ hashFiles('ci/test-loader-order.sh') != '' }}
        run: bash ci/test-loader-order.sh
      - name: Test the App's configuration-menu gesture on host
        if: ${{ hashFiles('ci/test-config-request.sh') != '' }}
        run: bash ci/test-config-request.sh
      - name: Test the scoreboard's column arithmetic on host
        if: ${{ hashFiles('ci/test-card-columns.sh') != '' }}
        run: bash ci/test-card-columns.sh
      - name: Test the RAM picture budget against the TLS pool on host
        if: ${{ hashFiles('ci/test-ram-picture-budget.sh') != '' }}
        run: bash ci/test-ram-picture-budget.sh
      - name: Test the reported counters past the end of a uint8_t on host
        if: ${{ hashFiles('ci/test-reported-counter.sh') != '' }}
        run: bash ci/test-reported-counter.sh
      - name: Compile against production toolchain and check real partitions
        run: bash ci/build-firmware.sh
      # The byte counts, so a branch can be compared with another branch's run.
      # Both boards, both binaries.
      - name: Report the compiled sizes
        run: |
          set -euo pipefail
          for f in build/esp32.esp32.esp32/CAL.ino.bin \
                   build/esp32.esp32.esp32s3/CAL.ino.bin \
                   App/build/esp32.esp32.esp32/App.ino.bin \
                   App/build/esp32.esp32.esp32s3/App.ino.bin; do
            if [ -f "$f" ]; then
              printf 'SIZE %s %s\n' "$(stat -c %s "$f")" "$f"
            else
              printf 'SIZE missing %s\n' "$f"
            fi
          done
