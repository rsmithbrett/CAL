# Rebuilds the ESP32 Arduino core's precompiled libraries with a smaller
# mbedTLS record buffer, to fix the TLS failure this fleet has been living with.
#
# WHY THIS EXISTS
#
# A new TLS session needs roughly 32KB CONTIGUOUS on this board: the stock core
# ships CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384, which buys a 16KB inbound plus
# a 16KB outbound record buffer. The largest 8-bit block an ESP32-D0WD-V3 has
# once WiFi is up is about 34,804 bytes, and it falls well below that while
# cards are rendering - 4,596 has been measured. Handshakes then fail with
# MBEDTLS_ERR_SSL_ALLOC_FAILED (-32512) and the device becomes unreachable for
# telemetry, card policy AND firmware updates simultaneously.
#
# Neither runtime escape is available: the shipped build defines no
# MBEDTLS_SSL_MAX_FRAGMENT_LENGTH (so RFC 6066 negotiation cannot be used) and
# no MBEDTLS_DYNAMIC_BUFFER. The buffers are sized inside mbedtls_ssl_setup()
# from a compile-time constant, so nothing on the API side can change them -
# not NetworkClientSecure, not raw mbedTLS. The library has to be rebuilt.
#
# 4096 takes the pair from ~32KB to ~8KB, which fits inside the worst contiguous
# block observed on a struggling device with room to spare. TLS 1.2/1.3 both
# tolerate smaller records, and this fleet's payloads are small JSON plus assets
# under ~20KB.
#
# WHY ON A RUNNER RATHER THAN THE SERVER
#
# The machine that would otherwise do this is also the one serving the fleet,
# and getting Docker Linux containers working on it needs a WSL2 distro or
# Hyper-V, i.e. a reboot of the production host. A hosted runner costs nothing
# and touches nothing.
#
# WHAT THIS DOES NOT DO
#
# It produces libraries as an artifact. It does NOT change how firmware is
# built - build-and-release.yml still installs the stock core from the Arduino
# index, so releases are unaffected until something is changed to consume these.
# That is deliberate: this runs, we inspect what it produced, and adopting it is
# a separate decision.
name: Rebuild mbedTLS libs (smaller TLS record buffers)

# Manual only. This is a multi-hour build and must never fire on a push.
on:
  workflow_dispatch:
    inputs:
      content_len:
        description: "CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN (bytes). 16384 is the stock value; 4096 is the fix."
        required: true
        default: "4096"
      dynamic_buffer:
        description: "Also set CONFIG_MBEDTLS_DYNAMIC_BUFFER=y (frees TLS buffers between records)"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    # Hosted runners hard-stop at 6 hours. Leaving headroom under that so the
    # artifact upload still happens if the build itself runs long.
    timeout-minutes: 330

    steps:
      # A stock hosted runner has roughly 14GB free, and ESP-IDF plus the
      # toolchains plus build output does not fit. These directories are worth
      # about 25GB combined and nothing here uses any of them.
      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl libssl-dev libncurses-dev flex bison \
                                  gperf python3 python3-pip python3-venv cmake ninja-build \
                                  ccache jq

      # release/v5.5 because this fleet's core (arduino-esp32 3.3.11) reports
      # CONFIG_IDF_INIT_VERSION "5.5.5". Libraries built against a different IDF
      # minor are not safe to drop into this core.
      - name: Check out esp32-arduino-lib-builder
        run: |
          git clone --depth 1 --branch release/v5.5 \
            https://github.com/espressif/esp32-arduino-lib-builder.git lib-builder
          cd lib-builder
          git log -1 --format='lib-builder at %h %ci %s'

      # The layout of configs/ moves between releases, so this does not assume a
      # path - it finds the fragment that already carries the stock value and
      # edits that, and fails loudly if it cannot find one. A silent miss here
      # would produce libraries that look correct and still contain 16384, which
      # is the single worst outcome available to this workflow.
      - name: Apply the mbedTLS configuration
        run: |
          set -euo pipefail
          cd lib-builder
          echo "--- configs/ before ---"
          ls -la configs/ || true

          TARGETS=$(grep -rl "CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN" configs/ || true)
          if [ -z "$TARGETS" ]; then
            echo "::error::No config fragment defines CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN."
            echo "The layout has changed; inspect configs/ above and update this workflow."
            exit 1
          fi

          echo "--- fragments defining the setting ---"
          echo "$TARGETS"
          for f in $TARGETS; do
            sed -i "s/^CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=.*/CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=${{ inputs.content_len }}/" "$f"
            echo "$f -> $(grep CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN "$f")"
          done

          if [ "${{ inputs.dynamic_buffer }}" = "true" ]; then
            # Appended to the common fragment rather than edited in place: it is
            # absent from the stock config, so there is nothing to substitute.
            echo "CONFIG_MBEDTLS_DYNAMIC_BUFFER=y" >> configs/defconfig.common
            echo "appended CONFIG_MBEDTLS_DYNAMIC_BUFFER=y to configs/defconfig.common"
          fi

      # esp32 only. Building every target multiplies the time by roughly the
      # number of chips supported, and this fleet is entirely ESP32-D0WD-V3.
      - name: Build
        run: |
          set -euo pipefail
          cd lib-builder
          ./build.sh -t esp32 2>&1 | tail -n 400

      # The whole point of the exercise, verified rather than assumed. If the
      # generated sdkconfig still says 16384 then the fragment edit did not
      # reach the build and the artifact is worthless - better to fail here than
      # to ship libraries that quietly changed nothing.
      - name: Verify the setting actually took effect
        run: |
          set -euo pipefail
          cd lib-builder
          FOUND=$(grep -rh "CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN" \
                    $(find . -name sdkconfig -o -name sdkconfig.h | head -20) 2>/dev/null | sort -u || true)
          echo "--- generated values ---"
          echo "$FOUND"
          if echo "$FOUND" | grep -q "=${{ inputs.content_len }}\b\|CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN ${{ inputs.content_len }}"; then
            echo "OK: built with ${{ inputs.content_len }}"
          else
            echo "::error::Generated config does not carry ${{ inputs.content_len }} - the edit did not reach the build."
            exit 1
          fi

      - name: Upload the rebuilt libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-libs-mbedtls-${{ inputs.content_len }}
          path: |
            lib-builder/out/**
            lib-builder/dist/**
          if-no-files-found: warn
          retention-days: 14
