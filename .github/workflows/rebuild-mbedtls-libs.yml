# Rebuilds the ESP32 Arduino core's precompiled libraries with a smaller TLS
# heap footprint, to fix the TLS failure this fleet has been living with.
#
# WHY THIS EXISTS
#
# A new TLS session needs roughly 32KB CONTIGUOUS on this board: the stock core
# ships CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384, which buys a 16KB inbound plus
# a 16KB outbound record buffer. The largest 8-bit block an ESP32-D0WD-V3 has
# once WiFi is up is about 34,804 bytes, and it falls well below that while
# cards are rendering - 4,596 has been measured. Handshakes then fail with
# MBEDTLS_ERR_SSL_ALLOC_FAILED (-32512) and the device becomes unreachable for
# telemetry, card policy AND firmware updates simultaneously.
#
# Neither runtime escape is available: the shipped build defines no
# MBEDTLS_SSL_MAX_FRAGMENT_LENGTH (so RFC 6066 negotiation cannot be used) and
# no MBEDTLS_DYNAMIC_BUFFER. The buffers are sized inside mbedtls_ssl_setup()
# from a compile-time constant, so nothing on the API side can change them -
# not NetworkClientSecure, not raw mbedTLS. The library has to be rebuilt.
#
# AND WHY THE STOCK LIBRARIES ARE LIKE THAT, stated narrowly.
#
# Three things are verified:
#
#   1. lib-builder master's configs/defconfig.common sets
#      CONFIG_MBEDTLS_DYNAMIC_BUFFER=y (and has carried that line since a commit
#      dated December 2022).
#   2. The sdkconfig shipped with arduino-esp32 3.3.11, at
#      tools/esp32-libs/3.3.11/sdkconfig, does NOT contain
#      CONFIG_MBEDTLS_DYNAMIC_BUFFER at all - not "=y", not "=n", not
#      "# ... is not set". Absent.
#   3. That same shipped sdkconfig has CONFIG_MBEDTLS_SSL_PROTO_DTLS=y, and IDF
#      release/v5.5's components/mbedtls/Kconfig declares
#
#          config MBEDTLS_DYNAMIC_BUFFER
#              select MBEDTLS_ASYMMETRIC_CONTENT_LEN
#              depends on !IDF_TARGET_LINUX && !MBEDTLS_SSL_PROTO_DTLS \
#                         && !MBEDTLS_SSL_VARIABLE_BUFFER_LENGTH
#
#      Kconfig omits a symbol whose dependencies are unmet, silently. That makes
#      the option unsatisfiable in this configuration, which explains (2).
#
# So: the current lib-builder config requests dynamic TLS buffers, the shipped
# 3.3.11 sdkconfig does not contain the symbol, and with DTLS enabled Kconfig
# makes that option unsatisfiable. The configuration conflict is established.
#
# WHAT IS NOT ESTABLISHED, and is deliberately not claimed here. An earlier
# version of this comment said the setting "has been requested and silently
# dropped on every official build for four years". That generalises two data
# points - one current defconfig, one shipped sdkconfig - into a release-history
# claim that was never checked. Whether other releases in that lineage shipped
# the same way, and when the conflict first appeared, is a separate question
# answerable only by sampling generated sdkconfigs or artifacts across those
# releases. Worth doing, and worth doing AFTER this build has proved the
# mechanism, not before.
#
# Note what this means for the experiment's baseline: the stock Arduino build
# the fleet runs today is already the real non-dynamic control, since the
# feature demonstrably is not in it. This workflow's "baseline" variant proves
# the rebuild itself is neutral, which is a different and still useful thing,
# but it is not where the non-dynamic comparison comes from.
#
# The order is therefore: clear the conflicting dependency, ASSERT the generated
# configuration actually contains the symbol (the Verify step below refuses to
# pass otherwise), and only then measure whether runtime behaviour changes.
#
# 4096 takes the pair from ~32KB to ~8KB, which fits inside the worst contiguous
# block observed on a struggling device with room to spare. TLS 1.2/1.3 both
# tolerate smaller records, and this fleet's payloads are small JSON plus assets
# under ~20KB.
#
# WHY ON A RUNNER RATHER THAN THE SERVER
#
# The machine that would otherwise do this is also the one serving the fleet,
# and getting Docker Linux containers working on it needs a WSL2 distro or
# Hyper-V, i.e. a reboot of the production host. A hosted runner costs nothing
# and touches nothing.
#
# WHAT THIS DOES NOT DO
#
# It produces libraries as an artifact. It does NOT change how firmware is
# built - build-and-release.yml still installs the stock core from the Arduino
# index, so releases are unaffected until something is changed to consume these.
# That is deliberate: this runs, we inspect what it produced, and adopting it is
# a separate decision.
name: Rebuild mbedTLS libs (reduce TLS heap footprint)

# Manual only. This is a multi-hour build and must never fire on a push.
#
# ONE VARIABLE PER BUILD, IN THIS ORDER
#
# Run these as four separate builds rather than one combined change, so that a
# result attributes to something:
#
#   1. baseline    - rebuilt core, no TLS config change. Proves the custom
#                    library build is itself neutral. Without this, any later
#                    difference could be the rebuild rather than the setting.
#   2. dynamic     - DYNAMIC_BUFFER + FREE_CONFIG_DATA + FREE_CA_CERT.
#                    Espressif's own figures put TLS heap at roughly 42KB
#                    default against ~22KB with this combination, and it
#                    attacks precisely this failure: TLS transiently taking
#                    large contiguous internal-SRAM blocks.
#   3. contentlen  - 4096 alone. Only worth building if (2) leaves too little
#                    contiguous headroom.
#   4. both        - only if (2) alone is insufficient.
#
# Prefer stopping at (2). Leaving the record length at its normal value avoids
# constraining TLS records at all, and 4096 is a compatibility/performance
# variable that should not be spent unless it is needed.
#
# SUCCESS IS NOT "IT COMPILES"
#
# The criterion is behavioural, measured on a device after repeated HTTPS plus
# PNG/asset cycles: the largest free 8-bit block must stay comfortably above the
# largest contiguous allocation the application needs, and must stop ratcheting
# downward across a session. Today it starts near 34,804 and has been measured
# at 4,596 while cards render. A dynamic-buffer build that lifts the post-TLS
# figure by 15-25KB and HOLDS it there is a pass.
#
# Note for whoever measures it: read heap_caps_get_largest_free_block
# (MALLOC_CAP_8BIT), not ESP.getMaxAllocHeap(). The latter reads a constant
# 32,756 on this board while the true figure ranges 7,668-47,092, and it has
# already caused several wrong diagnoses. The App's [heapdiag] and [health]
# lines print both side by side for exactly this reason.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which one thing to change (run them in order; see the header)"
        required: true
        type: choice
        default: "dynamic"
        options:
          - baseline
          - dynamic
          - contentlen
          - both
      content_len:
        description: "Record buffer size, used only by the contentlen/both variants"
        required: true
        default: "4096"

jobs:
  build:
    runs-on: ubuntu-latest
    # Hosted runners hard-stop at 6 hours. Leaving headroom under that so the
    # artifact upload still happens if the build itself runs long.
    timeout-minutes: 330

    steps:
      # A stock hosted runner has roughly 14GB free, and ESP-IDF plus the
      # toolchains plus build output does not fit. These directories are worth
      # about 25GB combined and nothing here uses any of them.
      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl libssl-dev libncurses-dev flex bison \
                                  gperf python3 python3-pip python3-venv cmake ninja-build \
                                  ccache jq

      # master, not release/v5.5.
      #
      # The first run of this workflow died here in four minutes: "fatal: Remote
      # branch release/v5.5 not found in upstream origin". The branch was chosen
      # because this fleet's core (arduino-esp32 3.3.11) reports
      # CONFIG_IDF_INIT_VERSION "5.5.5", on the assumption that lib-builder's
      # release branches track the IDF version. They do, but only historically -
      # the newest are release/v6.0 and release/v6.1, release/v3.3 was last
      # touched in 2021, and there has never been a v5.5. The IDF version is
      # pinned INSIDE the repository instead: tools/config.sh on master sets
      # IDF_BRANCH="release/v5.5", which is exactly the pin this build wants.
      # master is also the actively maintained line (last commit 2026-09-02).
      #
      # The version pin is asserted below rather than trusted, because "we are
      # building against the IDF this core ships" is the one assumption that
      # makes the resulting libraries safe to drop in, and master will move.
      - name: Check out esp32-arduino-lib-builder
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master \
            https://github.com/espressif/esp32-arduino-lib-builder.git lib-builder
          cd lib-builder
          git log -1 --format='lib-builder at %h %ci %s'

          PINNED=$(grep -oP 'IDF_BRANCH="\K[^"]+' tools/config.sh | head -1)
          echo "lib-builder pins IDF_BRANCH=$PINNED"
          if [ "$PINNED" != "release/v5.5" ]; then
            echo "::error::lib-builder master now pins IDF $PINNED, not release/v5.5."
            echo "This fleet's core (arduino-esp32 3.3.11) reports CONFIG_IDF_INIT_VERSION 5.5.5."
            echo "Libraries built against a different IDF minor are not safe to drop into it."
            echo "Pin this checkout to a lib-builder commit that still targets release/v5.5."
            exit 1
          fi

      # The layout of configs/ moves between releases, so this does not assume a
      # path - it finds the fragment that already carries the stock value and
      # edits that, and fails loudly if it cannot find one. A silent miss here
      # would produce libraries that look correct and still contain 16384, which
      # is the single worst outcome available to this workflow.
      - name: Apply the mbedTLS configuration
        run: |
          set -euo pipefail
          cd lib-builder
          VARIANT="${{ inputs.variant }}"
          echo "--- configs/ before ---"
          ls -la configs/ || true

          if [ "$VARIANT" = "baseline" ]; then
            echo "baseline: leaving every mbedTLS setting at its stock value on purpose."
            echo "This build exists to prove the rebuilt libraries behave identically to"
            echo "the published core, so that a later difference attributes to the setting"
            echo "rather than to the act of rebuilding."
          fi

          # The three dynamic settings go together. DYNAMIC_BUFFER alone still
          # holds the config data and the CA copy for the session's life; the
          # other two are what turn the saving from partial into the ~42KB ->
          # ~22KB Espressif documents.
          #
          # DTLS MUST BE TURNED OFF IN THE SAME BREATH, and this is the finding
          # that explains the entire bug rather than merely working around it.
          #
          # configs/defconfig.common on lib-builder master has carried
          # CONFIG_MBEDTLS_DYNAMIC_BUFFER=y since December 2022. The libraries
          # this fleet actually runs do not have it - the symbol is not in
          # tools/esp32-libs/3.3.11/sdkconfig at all, not even as "is not set".
          # The reason is IDF release/v5.5 components/mbedtls/Kconfig:
          #
          #     config MBEDTLS_DYNAMIC_BUFFER
          #         select MBEDTLS_ASYMMETRIC_CONTENT_LEN
          #         depends on !IDF_TARGET_LINUX && !MBEDTLS_SSL_PROTO_DTLS \
          #                    && !MBEDTLS_SSL_VARIABLE_BUFFER_LENGTH
          #
          # and the shipped config has CONFIG_MBEDTLS_SSL_PROTO_DTLS=y. Kconfig
          # drops a symbol whose dependencies are unmet, silently: the request
          # is made, nothing objects, and the feature is simply absent. Four
          # years of official builds have been asking for dynamic buffers and
          # not getting them, and nothing anywhere says so.
          #
          # So appending the three settings without also clearing DTLS would
          # reproduce exactly that silence - a green build, an artifact, and no
          # behavioural change whatsoever. The Verify step below is what would
          # eventually have caught it; clearing DTLS here is what makes the
          # build worth running.
          #
          # Nothing in this firmware speaks DTLS. The App does HTTPS over TCP
          # and nothing else: no ESP-NOW, no Matter, no Thread, no CoAP. It is
          # on in the stock config because the stock config serves every board
          # and every use, not this one.
          if [ "$VARIANT" = "dynamic" ] || [ "$VARIANT" = "both" ]; then
            {
              echo "# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set"
              echo "CONFIG_MBEDTLS_DYNAMIC_BUFFER=y"
              echo "CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y"
              echo "CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y"
            } >> configs/defconfig.common

            # Appending "# ... is not set" does not override an earlier "=y" in
            # the same fragment the way an "=n" would, so clear the positive
            # line wherever it is actually set rather than relying on ordering.
            for f in $(grep -rl "^CONFIG_MBEDTLS_SSL_PROTO_DTLS=y" configs/ || true); do
              sed -i "s/^CONFIG_MBEDTLS_SSL_PROTO_DTLS=y/# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set/" "$f"
              echo "cleared DTLS in $f"
            done

            echo "appended the three dynamic-buffer settings, and disabled DTLS which blocks them"
          fi

          # Edited in place rather than appended, because the stock config
          # already defines it and a duplicate would be ambiguous. The fragment
          # is located rather than assumed - the layout of configs/ moves
          # between releases - and a failure to find it is fatal, because
          # libraries that look correct and still contain 16384 are the worst
          # outcome this workflow could produce.
          if [ "$VARIANT" = "contentlen" ] || [ "$VARIANT" = "both" ]; then
            TARGETS=$(grep -rl "CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN" configs/ || true)
            if [ -z "$TARGETS" ]; then
              echo "::error::No config fragment defines CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN."
              echo "The layout has changed; inspect the configs/ listing above and update this workflow."
              exit 1
            fi
            for f in $TARGETS; do
              sed -i "s/^CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=.*/CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=${{ inputs.content_len }}/" "$f"
              echo "$f -> $(grep CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN "$f")"
            done
          fi

      # esp32 only. Building every target multiplies the time by roughly the
      # number of chips supported, and this fleet is entirely ESP32-D0WD-V3.
      #
      # GITHUB_REPOSITORY_OWNER IS OVERRIDDEN, and it has to be.
      #
      # lib-builder's tools/config.sh decides whose arduino-esp32 and esp-idf to
      # clone from the environment:
      #
      #     AR_USER="${GITHUB_REPOSITORY_OWNER:-espressif}"
      #     AR_REPO="$AR_USER/arduino-esp32"
      #
      # The default is espressif, but GitHub Actions always sets that variable,
      # so on this runner it resolved to the owner of THIS repository and the
      # build went looking for rsmithbrett/arduino-esp32. That repository does
      # not exist, git fell back to asking for a username, and with no tty it
      # died with "could not read Username for 'https://github.com': No such
      # device or address" - a credentials error that has nothing to do with
      # credentials.
      #
      # The assumption baked into that default is that lib-builder runs from a
      # fork inside an org that also forks arduino-esp32 and esp-idf, which is
      # how Espressif's own CI uses it. This workflow lives in an unrelated
      # repository and wants the upstream sources, so it says so explicitly.
      #
      # GITHUB_TOKEN is deliberately NOT set: config.sh would splice it into the
      # clone URLs, and these are public repositories that need no token.
      # install-arduino.sh only clones if components/arduino is absent:
      #
      #     if [ ! -d "$AR_COMPS/arduino" ]; then
      #         git clone $AR_REPO_URL "$AR_COMPS/arduino"
      #     fi
      #
      # So putting the right repository there first makes its own clone a no-op,
      # and everything after it - fetch, checkout -B, pull --ff-only - works
      # against a remote that exists. It then resolves the branch itself
      # (idf-release/v5.5 if present, else master) exactly as it would have.
      #
      # This is belt and braces over the GITHUB_REPOSITORY_OWNER override on the
      # build step below, and it is here because that override alone did not fix
      # it: run 34553618905 shows GITHUB_REPOSITORY_OWNER=espressif in the step
      # env and STILL died with "could not read Username for
      # 'https://github.com'" on this clone - while the TinyUSB clone two lines
      # earlier, anonymous and from the same host, succeeded. Whatever
      # AR_REPO_URL was resolving to, it was not the public upstream. Rather
      # than keep bisecting a variable inside someone else's script, this states
      # the source outright, and the echo below records what the script thought
      # it was going to use so the next failure is diagnosable in one read.
      - name: Pre-place the upstream arduino-esp32 source
        run: |
          set -euo pipefail
          cd lib-builder
          git clone --quiet https://github.com/espressif/arduino-esp32.git components/arduino
          git -C components/arduino log -1 --format='arduino-esp32 at %h %ci %s'

      - name: Build
        env:
          GITHUB_REPOSITORY_OWNER: espressif
        run: |
          set -euo pipefail
          cd lib-builder

          # What the script resolved, printed before it is used. AR_REPO_URL is
          # the value that has failed twice with a credentials error on a public
          # repository, and it has never been visible in a log.
          ( source ./tools/config.sh >/dev/null 2>&1 || true
            echo "AR_USER=${AR_USER:-<unset>}"
            echo "AR_REPO=${AR_REPO:-<unset>}"
            echo "AR_REPO_URL=${AR_REPO_URL:-<unset>}"
            echo "IDF_BRANCH=${IDF_BRANCH:-<unset>}" ) || true

          ./build.sh -t esp32 2>&1 | tail -n 400

      # The whole point of the exercise, verified rather than assumed. If the
      # generated sdkconfig still says 16384 then the fragment edit did not
      # reach the build and the artifact is worthless - better to fail here than
      # to ship libraries that quietly changed nothing.
      # Verified against the GENERATED sdkconfig, not the fragment that was
      # edited. A fragment the build ignored would leave the fragment looking
      # correct and the libraries unchanged, and nothing downstream would ever
      # reveal it - the firmware would simply keep failing handshakes for a
      # reason we had convinced ourselves was fixed.
      - name: Verify the intended settings actually took effect
        run: |
          set -euo pipefail
          cd lib-builder
          VARIANT="${{ inputs.variant }}"
          CFGS=$(find . -name sdkconfig -o -name sdkconfig.h 2>/dev/null | head -40)
          if [ -z "$CFGS" ]; then
            echo "::error::No generated sdkconfig found - the build did not get far enough to verify."
            exit 1
          fi

          echo "--- record length, as generated ---"
          grep -rh "CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN" $CFGS 2>/dev/null | sort -u || true
          echo "--- dynamic buffer settings, as generated ---"
          grep -rh "CONFIG_MBEDTLS_DYNAMIC" $CFGS 2>/dev/null | sort -u || echo "(none)"

          fail=0

          if [ "$VARIANT" = "dynamic" ] || [ "$VARIANT" = "both" ]; then
            # MBEDTLS_DYNAMIC_BUFFER selects MBEDTLS_ASYMMETRIC_CONTENT_LEN, so
            # that one is asserted too: if it is missing, the symbol was dropped
            # rather than enabled, which is the exact silent failure the stock
            # libraries have been shipping for four years (see the DTLS note in
            # "Apply the mbedTLS configuration" above).
            for k in CONFIG_MBEDTLS_DYNAMIC_BUFFER \
                     CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA \
                     CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT \
                     CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN; do
              if grep -rhq "^#define $k 1\|^$k=y" $CFGS 2>/dev/null; then
                echo "OK: $k enabled"
              else
                echo "::error::$k did not reach the generated config."
                fail=1
              fi
            done

            # The dependency, asserted directly. DTLS left on is the one way the
            # four checks above can all fail at once for a single reason, and
            # saying so here turns four confusing errors into one actionable
            # line.
            if grep -rhq "^#define CONFIG_MBEDTLS_SSL_PROTO_DTLS 1\|^CONFIG_MBEDTLS_SSL_PROTO_DTLS=y" $CFGS 2>/dev/null; then
              echo "::error::DTLS is still enabled, which makes MBEDTLS_DYNAMIC_BUFFER unselectable."
              echo "Kconfig drops it silently rather than complaining. Check the sed in the apply step."
              fail=1
            else
              echo "OK: DTLS disabled, so the dynamic-buffer symbols are selectable"
            fi
          fi

          if [ "$VARIANT" = "contentlen" ] || [ "$VARIANT" = "both" ]; then
            WANT="${{ inputs.content_len }}"
            if grep -rhq "CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN[ =]$WANT\b" $CFGS 2>/dev/null; then
              echo "OK: record length $WANT"
            else
              echo "::error::Record length is not $WANT in the generated config."
              fail=1
            fi
          fi

          if [ "$VARIANT" = "baseline" ]; then
            # A baseline that quietly picked up a change would invalidate every
            # comparison made against it, so this asserts the absence too.
            if grep -rhq "CONFIG_MBEDTLS_DYNAMIC" $CFGS 2>/dev/null; then
              echo "::error::baseline build contains dynamic-buffer settings - it is not a baseline."
              fail=1
            else
              echo "OK: baseline carries no dynamic-buffer settings"
            fi
          fi

          exit $fail

      - name: Upload the rebuilt libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-libs-${{ inputs.variant }}
          path: |
            lib-builder/out/**
            lib-builder/dist/**
          if-no-files-found: warn
          retention-days: 14
