name: Build CAL bench image (no release)

# PR builds produce a downloadable artifact only. They do NOT publish a
# GitHub Release, register firmware in DiscoverAroundMe, or mark it current.
on:
  pull_request:
    branches: [main]
    paths:
      - "CAL.ino"
      - "Recovery*"
      - "PresenceTest.h"
      - "GpioMonitor.h"
      - "libraries/DamBoards/**"
      - "App/Motion.cpp"
      - "App/Loader.cpp"
      - "App/Loader.h"
      - "App/Identity.h"
      # The App's half of the configuration gesture, the file that feeds it
      # taps, and the scoreboard columns the second host test reads. Without
      # these, a change to the gesture ran no CI at all on a pull request: the
      # mutation that made the App accept six taps in one corner touched only
      # App/ConfigRequest.cpp.
      - "App/ConfigRequest.cpp"
      - "App/ConfigRequest.h"
      - "App/CardManager.cpp"
      - "App/CardColumns.h"
      - "App/Display.cpp"
      - "App/Display.h"
      # What the content-key gates read. Every file in App/ that calls
      # Cards::registerCard, as a glob rather than the sixteen names it matches
      # today: a new card is a new file, and a list here would be the one place
      # nobody updates. The glob also covers the CardManager.cpp fallback order
      # and the CheckIn.cpp attribute name ci/check-content-key-resolvers.sh
      # pins. Cards.h below is what ci/test-key-policy.sh compiles for the
      # KeyPolicy argument. The two host tests compile PersonalPhotos.cpp,
      # Announcement.cpp and HomeValue.cpp against the headers below, and the
      # reported-counter test compiles ReportedCounter.h.
      - "App/*.cpp"
      - "App/Announcement.h"
      - "App/Assets.h"
      - "App/Cards.h"
      - "App/HomeValue.h"
      - "App/Log.h"
      - "App/PersonalPhotos.h"
      - "App/ReportedCounter.h"
      # The App's own partition tables and the second board's. ci/build-firmware.sh
      # reads the table out of the build directory and compares the compiled size
      # against it, so a resized partition changes what that check allows. The
      # bare partitions.csv below is CAL's own, at the repository root, and matches
      # nothing under App/.
      - "App/partitions.csv"
      - "App/partitions-panellan-8mb.csv"
      - "partitions-panellan-8mb.csv"
      - "Provisioning.cpp"
      - "Identity.cpp"
      - "Identity.h"
      - "BrandSplash.h"
      - "Display.cpp"
      - "Display.h"
      - "Updater.cpp"
      - "Updater.h"
      - "tests/**"
      - "partitions.csv"
      - "ci/**"
      - ".github/workflows/bench-cal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-bench-cal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      # Above the host tests, because a stub reaching for a Microsoft-only
      # interface fails those tests with a wall of g++ output naming the symbol
      # and not the reason, and a failing step ends the job, so a diagnostic
      # below them never arrives. This one reads text and needs no toolchain, so
      # running it first costs seconds. Guarded by hashFiles with the four
      # below.
      - name: Check the host test stubs use interfaces both runners have
        if: ${{ hashFiles('ci/check-host-test-portability.sh') != '' }}
        run: bash ci/check-host-test-portability.sh

      - name: Test recovery gesture and actions on host
        run: bash ci/test-recovery-menu.sh

      - name: Test the loader's NVS write order on host
        run: bash ci/test-loader-order.sh

      - name: Test the App's configuration-menu gesture on host
        run: bash ci/test-config-request.sh

      - name: Test the scoreboard's column arithmetic on host
        run: bash ci/test-card-columns.sh
      - name: Test the brand splash length on host
        run: bash ci/test-brand-splash.sh
      - name: Test the RAM picture budget against the TLS pool on host
        run: bash ci/test-ram-picture-budget.sh
      - name: Check the RAM budget's call site
        run: bash ci/check-ram-budget-call.sh

      # The rest of what build-and-release.yml runs before it publishes. These
      # four ran nowhere on a pull request, so the first time any of them ran
      # against work reaching main was on main, where failing one skips every
      # later step and publishes no release. The step names match that
      # workflow's so the two lanes read as the same list.
      #
      # Guarded by hashFiles, the way mut-host-test.yml guards its own: a branch
      # cut before one of these scripts existed runs the rest rather than
      # failing on a file it never had, which would read as the branch being at
      # fault. The release lane keeps them unguarded, because there a missing
      # gate script is itself the defect.
      - name: Test the reported counters past the end of a uint8_t on host
        if: ${{ hashFiles('ci/test-reported-counter.sh') != '' }}
        run: bash ci/test-reported-counter.sh
      - name: Test the unreachable watchdog's hold-off on host
        if: ${{ hashFiles('ci/test-unreachable-holdoff.sh') != '' }}
        run: bash ci/test-unreachable-holdoff.sh
      - name: Test the stored card policy on host
        if: ${{ hashFiles('ci/test-card-policy-store.sh') != '' }}
        run: bash ci/test-card-policy-store.sh
      - name: Test the WiFi setup confirmation on host
        if: ${{ hashFiles('ci/test-wifi-setup-button.sh') != '' }}
        run: bash ci/test-wifi-setup-button.sh
      - name: Test the personal photographs content key on host
        if: ${{ hashFiles('ci/test-personal-photos-key.sh') != '' }}
        run: bash ci/test-personal-photos-key.sh
      - name: Test the announcement and home value content keys on host
        if: ${{ hashFiles('ci/test-announcement-and-home-value-keys.sh') != '' }}
        run: bash ci/test-announcement-and-home-value-keys.sh
      - name: Test a card cannot register without naming a key policy
        if: ${{ hashFiles('ci/test-key-policy.sh') != '' }}
        run: bash ci/test-key-policy.sh
      - name: Check the content key reaches the wire
        if: ${{ hashFiles('ci/check-content-key-resolvers.sh') != '' }}
        run: bash ci/check-content-key-resolvers.sh
      - name: Check every card owes the key policy its registration states
        if: ${{ hashFiles('ci/check-card-key-decisions.sh') != '' }}
        run: bash ci/check-card-key-decisions.sh

      - name: Compile against production toolchain and check real partitions
        run: bash ci/build-firmware.sh

      - name: Check merged ESP32 recovery image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/esp32.esp32.esp32/CAL.ino.merged.bin")
          data = p.read_bytes()
          assert 0x10100 <= len(data) <= 0x400000, "not a 4MB-class merged image"
          assert data[0x1000] == 0xE9, "bootloader image missing at 0x1000"
          assert data[0x8000:0x8002] == bytes([0xAA, 0x50]), "partition table absent at 0x8000"
          assert data[0x10000] == 0xE9, "factory image missing at 0x10000"
          print(f"Bench merged image: {len(data)} bytes, structural checks passed")
          PY
          sha256sum build/esp32.esp32.esp32/CAL.ino.merged.bin

      - name: Upload merged bench image for /cal?bench=1
        uses: actions/upload-artifact@v4
        with:
          name: cal-bench-merged-image-${{ github.run_number }}
          path: build/esp32.esp32.esp32/CAL.ino.merged.bin
          if-no-files-found: error
          retention-days: 14
