plugins {
    id 'com.android.application'
}

android {
    namespace 'com.discoveraroundme.home'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.discoveraroundme.home'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-scaffold'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
